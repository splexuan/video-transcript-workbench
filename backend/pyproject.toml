[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript-workbench"
version = "0.1.4"
description = "Local-first video transcript workbench"
# 上界不是保守：ctranslate2 4.6 起在部分 Windows/CPU 环境加载模型会崩溃，依赖被限制在
# <4.6，而该版本只发到 cp312。允许 3.13+ 只会让「精准时间轴」静默装不上（或被迫用有问题的版本）。
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  # 繁简统一：Whisper 的中文输出常为繁体，落库前统一转简体（纯 Python，无需编译）
  "opencc-python-reimplemented>=0.1.7,<1",
  # 打包版常驻系统托盘：pystray 提供托盘菜单，Pillow 读图标
  "pystray>=0.19,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sherpa-onnx>=1.12,<2",
  "soundfile>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.8.1",
]

[project.optional-dependencies]
# 精准时间轴模式的可选引擎。安装命令：pip install ".[accurate]"
accurate = [
  "faster-whisper>=1.1,<2",
  # ctranslate2 4.6 起在部分 Windows/CPU 环境下加载模型会触发访问违例（0xC0000005），
  # 4.4/4.5 实测可用，因此在该问题修复前限制上界。
  "ctranslate2>=4.4,<4.6",
  # ctranslate2 4.5 导入时会 `import pkg_resources`，而 setuptools 81 起已不再提供，
  # 所以运行环境必须带上仍含它的 setuptools（4.6 之后才去掉这个导入）。
  "setuptools<81",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  # 打包工具链（Pillow 已随运行依赖安装，图标脚本与托盘都用它）
  "pyinstaller>=6.11,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
